name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the toolchain and components from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - run: cargo fmt --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      # The 1 MiB-under-a-second bound is asserted only in release builds.
      - run: cargo test --locked --release --test performance

  action:
    name: action tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - run: node --test tests/action*.test.cjs
        env:
          TICS_TEST_BINARY: ${{ github.workspace }}/target/release/tics

  prose-review:
    name: published 0.3.0 Action
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: finngi/tics@v0.3.0
        with:
          config: .tics-smoke.json
        id: tics
      - name: Verify agent report outputs
        env:
          TICS_REPORT: ${{ steps.tics.outputs.report-path }}
          TICS_CANDIDATES: ${{ steps.tics.outputs.candidates }}
          TICS_FILES: ${{ steps.tics.outputs.files-needing-review }}
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.TICS_REPORT, 'utf8'));
          assert.equal(report.schema, 'tics.review.v1');
          assert.equal(Number(process.env.TICS_CANDIDATES), report.summary.candidates);
          assert.equal(Number(process.env.TICS_FILES), report.summary.files_needing_review);
          const expected = fs.readFileSync('docs/tics-release-smoke.md', 'utf8').includes('world-class') ? 1 : 0;
          assert.equal(report.summary.files, 1);
          assert.equal(report.summary.candidates, expected);
          assert.equal(report.summary.files_needing_review, expected);
          if (expected) {
            const file = report.files[0];
            assert.equal(file.path, 'docs/tics-release-smoke.md');
            const candidate = file.candidates[0];
            assert.equal(candidate.rule, 'release-smoke');
            assert.equal(candidate.original, 'world-class');
            assert.equal(Buffer.from(file.source).subarray(candidate.range.start_byte, candidate.range.end_byte).toString(), candidate.original);
          }
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: tics-review
          path: ${{ steps.tics.outputs.report-path }}
